<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My読書記録</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Dexie.js (IndexedDB Wrapper) -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <!-- html5-qrcode (Barcode Scanner) -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        /* iOS/Androidのアクティブタップハイライトを無効化し、アプリらしい挙動にする */
        * { -webkit-tap-highlight-color: transparent; }
        body { overscroll-behavior-y: none; }
        .hide { display: none !important; }
        .view { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .scrollable { flex-grow: 1; overflow-y: auto; padding-bottom: 80px; } /* Bottom Navの余白 */
    </style>

    <script>
        // --- PWA Manifest & Service Worker の動的生成 ---
        const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#3b82f6"/><text x="50" y="55" font-size="50" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">読</text></svg>`;
        const iconBase64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgIcon)));

        const manifest = {
            name: "My読書記録",
            short_name: "読書記録",
            display: "standalone",
            start_url: ".",
            background_color: "#f3f4f6",
            theme_color: "#3b82f6",
            icons: [{ src: iconBase64, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        document.write(`<link rel="manifest" href="${URL.createObjectURL(manifestBlob)}">`);

        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => self.clients.claim());
                self.addEventListener('fetch', e => {
                    e.respondWith(fetch(e.request).catch(() => new Response('Offlineモードで動作中。')));
                });
            `;
            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(swBlob));
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans selection:bg-blue-200">

    <!-- アプリのヘッダー -->
    <header class="bg-blue-500 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold" id="header-title">本棚</h1>
        <div id="header-actions"></div>
    </header>

    <!-- メインコンテンツ (Views) -->
    <main class="relative h-full">

        <!-- 1. 本棚ビュー -->
        <div id="view-bookshelf" class="view">
            <div class="flex justify-between items-center p-4 bg-white border-b">
                <span class="text-sm text-gray-500" id="book-count">全 0 冊</span>
                <button id="btn-toggle-view" class="px-3 py-1 bg-gray-200 rounded text-sm">リスト表示切替</button>
            </div>
            <div id="bookshelf-container" class="scrollable p-4 space-y-4">
                <!-- JavaScriptでグループと本を描画 -->
            </div>
        </div>

        <!-- 2. 検索・追加ビュー -->
        <div id="view-add" class="view hide bg-white">
            <div class="p-4 space-y-4 scrollable">
                <button id="btn-start-scan" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold shadow flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    バーコード（ISBN）をスキャン
                </button>
                <div id="scanner-container" class="w-full hidden bg-black rounded-lg overflow-hidden">
                    <div id="reader" width="100%"></div>
                    <button id="btn-stop-scan" class="w-full bg-red-500 text-white py-2">スキャン中止</button>
                </div>
                
                <div class="relative flex items-center pt-4">
                    <div class="flex-grow border-t border-gray-300"></div>
                    <span class="flex-shrink-0 mx-4 text-gray-400 text-sm">または</span>
                    <div class="flex-grow border-t border-gray-300"></div>
                </div>

                <div class="flex gap-2">
                    <input type="text" id="search-keyword" placeholder="タイトル・著者名・ISBN" class="flex-grow p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="btn-search" class="bg-gray-800 text-white px-4 py-2 rounded-lg">検索</button>
                </div>
                
                <div id="search-results" class="space-y-3 mt-4 pb-10"></div>
            </div>
        </div>

        <!-- 3. 書籍詳細・編集ビュー (モーダル的に使用) -->
        <div id="view-edit" class="view hide bg-gray-50 absolute inset-0 z-20">
            <header class="bg-gray-800 text-white p-4 shadow-md flex justify-between items-center">
                <button id="btn-close-edit" class="text-white px-2">← 戻る</button>
                <h1 class="text-lg font-bold">読書記録の編集</h1>
                <button id="btn-save-book" class="text-blue-300 font-bold px-2">保存</button>
            </header>
            <div class="scrollable p-4 space-y-4">
                <input type="hidden" id="edit-id">
                <input type="hidden" id="edit-coverUrl">
                <input type="hidden" id="edit-isbn">
                
                <div class="bg-white p-4 rounded-lg shadow-sm space-y-3">
                    <div><label class="text-xs text-gray-500">タイトル</label><input type="text" id="edit-title" class="w-full border-b p-1 text-lg font-bold outline-none"></div>
                    <div><label class="text-xs text-gray-500">著者名</label><input type="text" id="edit-author" class="w-full border-b p-1 outline-none"></div>
                    <div class="flex gap-4">
                        <div class="flex-1"><label class="text-xs text-gray-500">出版社</label><input type="text" id="edit-publisher" class="w-full border-b p-1 outline-none"></div>
                        <div class="flex-1"><label class="text-xs text-gray-500">出版日</label><input type="text" id="edit-publishedDate" class="w-full border-b p-1 outline-none"></div>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-lg shadow-sm space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">登録日</label>
                        <input type="date" id="edit-registerDate" class="w-full p-2 border rounded bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">所属グループ (シリーズ)</label>
                        <select id="edit-groupId" class="w-full p-2 border rounded bg-gray-50"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">読書方法</label>
                        <select id="edit-readMethod" class="w-full p-2 border rounded bg-gray-50">
                            <option value="">未選択</option>
                            <option value="熟読">熟読</option>
                            <option value="斜め読み">斜め読み</option>
                            <option value="途中まで（挫折）">途中まで（挫折）</option>
                            <option value="時間切れ（要再読）">時間切れ（要再読）</option>
                            <option value="参考書読み">参考書読み</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">評価</label>
                        <select id="edit-rating" class="w-full p-2 border rounded bg-gray-50">
                            <option value="0">未評価</option>
                            <option value="5">☆☆☆☆☆ 5</option>
                            <option value="4">☆☆☆☆ 4</option>
                            <option value="3">☆☆☆ 3</option>
                            <option value="2">☆☆ 2</option>
                            <option value="1">☆ 1</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">入手方法</label>
                        <select id="edit-acquisitionSource" class="w-full p-2 border rounded bg-gray-50">
                            <option value="">未選択</option>
                            <option value="電子書籍">電子書籍</option>
                            <option value="購入">購入</option>
                            <option value="図書館">図書館</option>
                            <option value="Audio">Audio</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">感想・メモ (最大1000文字)</label>
                        <textarea id="edit-review" rows="5" maxlength="1000" class="w-full p-2 border rounded bg-gray-50"></textarea>
                    </div>
                </div>
                
                <button id="btn-delete-book" class="w-full py-3 text-red-500 border border-red-500 rounded-lg mt-4 font-bold">この本を削除する</button>
            </div>
        </div>

        <!-- 4. グループ管理ビュー -->
        <div id="view-groups" class="view hide bg-white">
            <div class="scrollable p-4 space-y-6">
                <div class="flex gap-2">
                    <input type="text" id="new-group-name" placeholder="新しいグループ名" class="flex-grow p-2 border rounded-lg focus:outline-none">
                    <button id="btn-create-group" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold">作成</button>
                </div>
                <div id="group-list-container" class="space-y-2"></div>
            </div>
        </div>

        <!-- 5. 設定・データ管理ビュー -->
        <div id="view-settings" class="view hide bg-white">
            <div class="scrollable p-6 space-y-8">
                <div>
                    <h2 class="text-lg font-bold border-b pb-2 mb-4">データのバックアップ</h2>
                    <p class="text-sm text-gray-600 mb-4">端末内の全データをCSV形式でダウンロードします。</p>
                    <button id="btn-export-csv" class="w-full bg-gray-800 text-white py-3 rounded-lg font-bold shadow">CSVをエクスポート</button>
                </div>
                
                <div>
                    <h2 class="text-lg font-bold border-b pb-2 mb-4">データの取り込み (ビブリア互換)</h2>
                    <p class="text-sm text-gray-600 mb-4">books.csv を選択してデータを追加登録します。<br>※既存のデータは上書きされず追加されます。</p>
                    <input type="file" id="file-import-csv" accept=".csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
            </div>
        </div>

    </main>

    <!-- ボトムナビゲーション -->
    <nav class="bg-white border-t flex justify-around fixed bottom-0 w-full z-10 pb-safe">
        <button class="nav-btn p-3 flex flex-col items-center text-blue-600" data-target="view-bookshelf">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            <span class="text-xs">本棚</span>
        </button>
        <button class="nav-btn p-3 flex flex-col items-center text-gray-500" data-target="view-add">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <span class="text-xs">追加・検索</span>
        </button>
        <button class="nav-btn p-3 flex flex-col items-center text-gray-500" data-target="view-groups">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            <span class="text-xs">グループ</span>
        </button>
        <button class="nav-btn p-3 flex flex-col items-center text-gray-500" data-target="view-settings">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span class="text-xs">データ</span>
        </button>
    </nav>

    <!-- メインのロジック -->
    <script>
        // -----------------------
        // 1. データベース設定 (Dexie.js)
        // -----------------------
        const db = new Dexie("BiblioAppDB");
        db.version(1).stores({
            books: 'id, isbn, title, author, groupId, registerDate', 
            groups: 'id, order'
        });

        // 状態管理
        let currentView = 'view-bookshelf';
        let isGridView = true;
        let html5QrCode = null;

        // -----------------------
        // 2. UIナビゲーション制御
        // -----------------------
        const navBtns = document.querySelectorAll('.nav-btn');
        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const target = btn.dataset.target;
                
                // アイコンの色変更
                navBtns.forEach(b => {
                    b.classList.remove('text-blue-600');
                    b.classList.add('text-gray-500');
                });
                btn.classList.remove('text-gray-500');
                btn.classList.add('text-blue-600');

                // ビューの切り替え
                document.querySelectorAll('.view').forEach(v => v.classList.add('hide'));
                document.getElementById(target).classList.remove('hide');
                
                // ヘッダータイトルの変更
                const titles = {
                    'view-bookshelf': '本棚',
                    'view-add': '本の登録・検索',
                    'view-groups': 'グループ管理',
                    'view-settings': 'データ管理'
                };
                document.getElementById('header-title').innerText = titles[target];

                // 初期化処理の呼び出し
                if(target === 'view-bookshelf') renderBookshelf();
                if(target === 'view-groups') renderGroupsManage();
            });
        });

        // -----------------------
        // 3. 本棚表示処理
        // -----------------------
        document.getElementById('btn-toggle-view').addEventListener('click', () => {
            isGridView = !isGridView;
            renderBookshelf();
        });

        async function renderBookshelf() {
            const container = document.getElementById('bookshelf-container');
            container.innerHTML = '';
            
            const books = await db.books.toArray();
            const groups = await db.groups.orderBy('order').toArray();
            
            document.getElementById('book-count').innerText = `全 ${books.length} 冊`;

            // グループ別に分類
            const groupedBooks = { '未分類': [] };
            groups.forEach(g => groupedBooks[g.id] = { name: g.name, books: [] });
            
            books.forEach(b => {
                if (b.groupId && groupedBooks[b.groupId]) {
                    groupedBooks[b.groupId].books.push(b);
                } else {
                    groupedBooks['未分類'].push(b);
                }
            });

            // 描画
            for (const [key, group] of Object.entries(groupedBooks)) {
                const isUncat = key === '未分類';
                const bookList = isUncat ? group : group.books;
                const groupName = isUncat ? '未分類' : group.name;

                if (bookList.length === 0 && isUncat) continue; // 空の未分類はスキップ

                const groupEl = document.createElement('div');
                groupEl.className = 'mb-6';
                
                // グループヘッダー
                const headerEl = document.createElement('h2');
                headerEl.className = 'text-lg font-bold border-b-2 border-blue-200 mb-3 pb-1 text-gray-700 flex justify-between';
                headerEl.innerHTML = `<span>${groupName}</span> <span class="text-sm font-normal text-gray-500">${bookList.length}冊</span>`;
                groupEl.appendChild(headerEl);

                // 本のリスト/グリッド
                const listEl = document.createElement('div');
                if (isGridView) {
                    listEl.className = 'grid grid-cols-3 gap-3';
                } else {
                    listEl.className = 'space-y-2';
                }

                bookList.sort((a, b) => (a.orderInGroup || 0) - (b.orderInGroup || 0));

                bookList.forEach(book => {
                    const item = document.createElement('div');
                    if (isGridView) {
                        item.className = 'flex flex-col items-center cursor-pointer';
                        const coverImg = book.coverUrl ? book.coverUrl : 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTQwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjE0MCIgZmlsbD0iI2VlZSIvPjx0ZXh0IHg9IjUwIiB5PSI3MCIgZm9udC1zaXplPSIxMiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iIzk5OSI+Tk8gSU1BR0U8L3RleHQ+PC9zdmc+';
                        item.innerHTML = `
                            <img src="${coverImg}" class="w-full h-32 object-cover rounded shadow-sm mb-1" loading="lazy">
                            <span class="text-xs text-center line-clamp-2 w-full">${book.title}</span>
                        `;
                    } else {
                        item.className = 'flex items-center p-2 bg-white rounded shadow-sm border cursor-pointer';
                        item.innerHTML = `
                            <div class="flex-grow min-w-0">
                                <p class="text-sm font-bold truncate">${book.title}</p>
                                <p class="text-xs text-gray-500 truncate">${book.author}</p>
                            </div>
                            <span class="text-xs text-blue-500 whitespace-nowrap ml-2">${book.registerDate || ''}</span>
                        `;
                    }
                    item.addEventListener('click', () => openEditBook(book));
                    listEl.appendChild(item);
                });
                
                if(bookList.length > 0) {
                    groupEl.appendChild(listEl);
                    container.appendChild(groupEl);
                }
            }
        }

        // -----------------------
        // 4. バーコードスキャン & 検索
        // -----------------------
        document.getElementById('btn-start-scan').addEventListener('click', () => {
            const container = document.getElementById('scanner-container');
            container.classList.remove('hidden');
            
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText, decodedResult) => {
                    if(decodedText.startsWith('978') || decodedText.startsWith('979')) {
                        stopScanner();
                        searchBookByISBN(decodedText);
                    }
                },
                (errorMessage) => { /* 無視 */ }
            ).catch(err => {
                alert("カメラの起動に失敗しました。HTTPS環境または権限を確認してください。");
                container.classList.add('hidden');
            });
        });

        document.getElementById('btn-stop-scan').addEventListener('click', stopScanner);

        function stopScanner() {
            if(html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('scanner-container').classList.add('hidden');
                }).catch(err => console.log(err));
            }
        }

        document.getElementById('btn-search').addEventListener('click', () => {
            const kw = document.getElementById('search-keyword').value.trim();
            if(!kw) return;
            // ISBNっぽければISBN検索、それ以外はGoogle Booksキーワード検索
            if(kw.replace(/-/g, '').match(/^97[89]\d{10}$/)) {
                searchBookByISBN(kw.replace(/-/g, ''));
            } else {
                searchBookByKeyword(kw);
            }
        });

        // 検索処理 (API)
        async function searchBookByISBN(isbn) {
            document.getElementById('search-results').innerHTML = '<p class="text-center text-gray-500">検索中...</p>';
            try {
                // 1. openBD (日本の書籍に強い)
                let res = await fetch(`https://api.openbd.jp/v1/get?isbn=${isbn}`);
                let data = await res.json();
                if(data && data[0]) {
                    const summary = data[0].summary;
                    showSearchResults([{
                        isbn: summary.isbn,
                        title: summary.title,
                        author: summary.author,
                        publisher: summary.publisher,
                        publishedDate: summary.pubdate,
                        coverUrl: summary.cover
                    }]);
                    return;
                }
                // 2. Google Books フォールバック
                res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
                data = await res.json();
                if(data.items && data.items.length > 0) {
                    const info = data.items[0].volumeInfo;
                    showSearchResults([{
                        isbn: isbn,
                        title: info.title,
                        author: info.authors ? info.authors.join(', ') : '',
                        publisher: info.publisher || '',
                        publishedDate: info.publishedDate || '',
                        coverUrl: info.imageLinks ? info.imageLinks.thumbnail.replace('http:', 'https:') : ''
                    }]);
                    return;
                }
                document.getElementById('search-results').innerHTML = '<p class="text-center text-red-500">見つかりませんでした。</p>';
            } catch (e) {
                document.getElementById('search-results').innerHTML = '<p class="text-center text-red-500">通信エラーが発生しました。</p>';
            }
        }

        async function searchBookByKeyword(keyword) {
            document.getElementById('search-results').innerHTML = '<p class="text-center text-gray-500">検索中...</p>';
            try {
                let res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(keyword)}&maxResults=10`);
                let data = await res.json();
                if(data.items && data.items.length > 0) {
                    const results = data.items.map(item => {
                        const info = item.volumeInfo;
                        let isbn = '';
                        if(info.industryIdentifiers) {
                            const i13 = info.industryIdentifiers.find(i => i.type === 'ISBN_13');
                            if(i13) isbn = i13.identifier;
                        }
                        return {
                            isbn: isbn,
                            title: info.title || 'タイトル不明',
                            author: info.authors ? info.authors.join(', ') : '',
                            publisher: info.publisher || '',
                            publishedDate: info.publishedDate || '',
                            coverUrl: info.imageLinks ? info.imageLinks.thumbnail.replace('http:', 'https:') : ''
                        };
                    });
                    showSearchResults(results);
                } else {
                    document.getElementById('search-results').innerHTML = '<p class="text-center text-red-500">見つかりませんでした。</p>';
                }
            } catch (e) {
                document.getElementById('search-results').innerHTML = '<p class="text-center text-red-500">通信エラーが発生しました。</p>';
            }
        }

        function showSearchResults(books) {
            const container = document.getElementById('search-results');
            container.innerHTML = '';
            books.forEach(b => {
                const el = document.createElement('div');
                el.className = 'flex gap-3 p-3 border rounded-lg bg-gray-50 shadow-sm items-center';
                const cover = b.coverUrl ? b.coverUrl : 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MCIgaGVpZ2h0PSI3MCI+PHJlY3Qgd2lkdGg9IjUwIiBoZWlnaHQ9IjcwIiBmaWxsPSIjZWVlIi8+PC9zdmc+';
                el.innerHTML = `
                    <img src="${cover}" class="w-12 h-16 object-cover border">
                    <div class="flex-grow min-w-0">
                        <p class="text-sm font-bold truncate">${b.title}</p>
                        <p class="text-xs text-gray-500 truncate">${b.author}</p>
                        <p class="text-xs text-gray-400">${b.publisher}</p>
                    </div>
                    <button class="bg-blue-500 text-white px-3 py-1 rounded text-sm whitespace-nowrap btn-register">登録</button>
                `;
                el.querySelector('.btn-register').addEventListener('click', async () => {
                    const today = new Date().toISOString().split('T')[0];
                    const newBook = {
                        id: crypto.randomUUID(),
                        isbn: b.isbn,
                        title: b.title,
                        author: b.author,
                        publisher: b.publisher,
                        publishedDate: b.publishedDate,
                        coverUrl: b.coverUrl,
                        registerDate: today,
                        readMethod: '',
                        rating: 0,
                        review: '',
                        acquisitionSource: '',
                        groupId: null,
                        orderInGroup: 0
                    };
                    await db.books.put(newBook);
                    openEditBook(newBook); // 保存して即編集画面へ
                    document.getElementById('search-keyword').value = '';
                    container.innerHTML = '';
                });
                container.appendChild(el);
            });
        }

        // -----------------------
        // 5. 書籍の編集・詳細
        // -----------------------
        async function openEditBook(book) {
            // グループ選択肢の生成
            const groups = await db.groups.orderBy('order').toArray();
            const groupSelect = document.getElementById('edit-groupId');
            groupSelect.innerHTML = '<option value="">未分類</option>';
            groups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.innerText = g.name;
                groupSelect.appendChild(opt);
            });

            // データのセット
            document.getElementById('edit-id').value = book.id;
            document.getElementById('edit-isbn').value = book.isbn || '';
            document.getElementById('edit-coverUrl').value = book.coverUrl || '';
            document.getElementById('edit-title').value = book.title || '';
            document.getElementById('edit-author').value = book.author || '';
            document.getElementById('edit-publisher').value = book.publisher || '';
            document.getElementById('edit-publishedDate').value = book.publishedDate || '';
            document.getElementById('edit-registerDate').value = book.registerDate || '';
            document.getElementById('edit-groupId').value = book.groupId || '';
            document.getElementById('edit-readMethod').value = book.readMethod || '';
            document.getElementById('edit-rating').value = book.rating || 0;
            document.getElementById('edit-acquisitionSource').value = book.acquisitionSource || '';
            document.getElementById('edit-review').value = book.review || '';

            document.getElementById('view-edit').classList.remove('hide');
        }

        document.getElementById('btn-close-edit').addEventListener('click', () => {
            document.getElementById('view-edit').classList.add('hide');
            if(currentView === 'view-bookshelf') renderBookshelf();
        });

        document.getElementById('btn-save-book').addEventListener('click', async () => {
            const updatedBook = {
                id: document.getElementById('edit-id').value,
                isbn: document.getElementById('edit-isbn').value,
                coverUrl: document.getElementById('edit-coverUrl').value,
                title: document.getElementById('edit-title').value,
                author: document.getElementById('edit-author').value,
                publisher: document.getElementById('edit-publisher').value,
                publishedDate: document.getElementById('edit-publishedDate').value,
                registerDate: document.getElementById('edit-registerDate').value,
                groupId: document.getElementById('edit-groupId').value || null,
                readMethod: document.getElementById('edit-readMethod').value,
                rating: Number(document.getElementById('edit-rating').value),
                acquisitionSource: document.getElementById('edit-acquisitionSource').value,
                review: document.getElementById('edit-review').value,
                orderInGroup: 0 // 並び順は簡易的に0とする
            };
            await db.books.put(updatedBook);
            alert('保存しました');
            document.getElementById('view-edit').classList.add('hide');
            renderBookshelf();
        });

        document.getElementById('btn-delete-book').addEventListener('click', async () => {
            if(confirm('本当にこの本を削除しますか？')) {
                const id = document.getElementById('edit-id').value;
                await db.books.delete(id);
                document.getElementById('view-edit').classList.add('hide');
                renderBookshelf();
            }
        });

        // -----------------------
        // 6. グループ管理
        // -----------------------
        async function renderGroupsManage() {
            const container = document.getElementById('group-list-container');
            container.innerHTML = '';
            const groups = await db.groups.orderBy('order').toArray();
            
            groups.forEach(g => {
                const el = document.createElement('div');
                el.className = 'flex justify-between items-center p-3 bg-gray-50 border rounded';
                el.innerHTML = `
                    <span class="font-bold">${g.name}</span>
                    <button class="text-red-500 text-sm px-2 py-1 btn-del-group">削除</button>
                `;
                el.querySelector('.btn-del-group').addEventListener('click', async () => {
                    if(confirm(`グループ「${g.name}」を削除しますか？ (中の本は「未分類」に戻ります)`)) {
                        // 所属する本のグループIDをクリア
                        await db.books.where('groupId').equals(g.id).modify({groupId: null});
                        await db.groups.delete(g.id);
                        renderGroupsManage();
                    }
                });
                container.appendChild(el);
            });
        }

        document.getElementById('btn-create-group').addEventListener('click', async () => {
            const nameInput = document.getElementById('new-group-name');
            const name = nameInput.value.trim();
            if(!name) return;
            const count = await db.groups.count();
            await db.groups.put({
                id: crypto.randomUUID(),
                name: name,
                order: count
            });
            nameInput.value = '';
            renderGroupsManage();
        });

        // -----------------------
        // 7. CSV インポート / エクスポート
        // -----------------------
        document.getElementById('btn-export-csv').addEventListener('click', async () => {
            const books = await db.books.toArray();
            if(books.length === 0) {
                alert('出力するデータがありません。'); return;
            }
            
            // ヘッダー作成
            const headers = ['id', 'isbn', 'title', 'author', 'publisher', 'publishedDate', 'registerDate', 'readMethod', 'rating', 'acquisitionSource', 'review', 'groupId', 'coverUrl'];
            let csvContent = '\uFEFF' + headers.join(',') + '\n'; // UTF-8 BOM

            books.forEach(b => {
                const row = headers.map(h => {
                    let val = b[h] === null || b[h] === undefined ? '' : String(b[h]);
                    // カンマ、改行、ダブルクォートを含む場合はエスケープ
                    if (val.includes(',') || val.includes('\n') || val.includes('"')) {
                        val = '"' + val.replace(/"/g, '""') + '"';
                    }
                    return val;
                });
                csvContent += row.join(',') + '\n';
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `my_books_backup_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('file-import-csv').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = async (event) => {
                const text = event.target.result;
                // 簡単なCSVパーサー (改行区切り -> カンマ区切り。※複雑な改行含むデータは要高度なパーサー)
                const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
                if(lines.length < 2) return alert('有効なCSVデータが見つかりません。');
                
                const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim());
                
                let importCount = 0;
                for(let i = 1; i < lines.length; i++) {
                    // 簡易的なCSV行分割（ダブルクォート内カンマ無視）
                    const regex = /(".*?"|[^",\s]+)(?=\s*,|\s*$)/g;
                    let match;
                    const row = [];
                    let idx = 0;
                    
                    // 単純な split(',') だと「タイトル, 副題」などでズレるため基本解析
                    let inQuotes = false;
                    let currentVal = '';
                    for(let char of lines[i]) {
                        if(char === '"') inQuotes = !inQuotes;
                        else if(char === ',' && !inQuotes) {
                            row.push(currentVal);
                            currentVal = '';
                        } else {
                            currentVal += char;
                        }
                    }
                    row.push(currentVal); // 最後の列

                    // ビブリア形式 or 当アプリバックアップ形式 のマッピング
                    const book = { id: crypto.randomUUID(), groupId: null, orderInGroup: 0 };
                    
                    // 各列をマッピング (ヘッダー名で推測)
                    headers.forEach((h, index) => {
                        let val = row[index] || '';
                        val = val.replace(/^"|"$/g, '').replace(/""/g, '"'); // エスケープ解除
                        
                        if(h.includes('タイトル') || h === 'title') book.title = val;
                        else if(h.includes('著者') || h === 'author') book.author = val;
                        else if(h.includes('ISBN') || h.toLowerCase() === 'isbn') book.isbn = val;
                        else if(h.includes('出版社') || h === 'publisher') book.publisher = val;
                        else if(h.includes('発行日') || h === 'publishedDate') book.publishedDate = val;
                        else if(h.includes('登録日') || h.includes('読了日') || h === 'registerDate') {
                            // YYYY/MM/DD -> YYYY-MM-DD
                            book.registerDate = val.replace(/\//g, '-').substring(0,10);
                        }
                        else if(h.includes('感想') || h === 'review') book.review = val;
                        else if(h.includes('評価') || h === 'rating') book.rating = Number(val.replace(/[^0-9]/g, '')) || 0;
                        else if(h === 'readMethod') book.readMethod = val;
                        else if(h === 'acquisitionSource') book.acquisitionSource = val;
                        else if(h === 'coverUrl') book.coverUrl = val;
                    });

                    // 必須項目があれば登録
                    if(book.title) {
                        if(!book.registerDate) book.registerDate = new Date().toISOString().split('T')[0];
                        await db.books.put(book);
                        importCount++;
                    }
                }
                
                alert(`${importCount} 冊のデータを取り込みました。`);
                e.target.value = ''; // リセット
                renderBookshelf();
            };
            reader.readAsText(file); // UTF-8前提 (Shift_JISの場合は要変換処理)
        });

        // -----------------------
        // 初期化
        // -----------------------
        window.addEventListener('DOMContentLoaded', () => {
            renderBookshelf();
        });

    </script>
</body>
