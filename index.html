<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 画像ブロック対策 -->
    <meta name="referrer" content="no-referrer">
    <title>My読書記録</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Dexie.js (IndexedDB) -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <!-- html5-qrcode (Barcode) -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { overscroll-behavior-y: none; }
        .hide { display: none !important; }
        .view { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .scrollable { flex-grow: 1; overflow-y: auto; padding-bottom: 80px; }
    </style>

    <script>
        // PWA Manifest & Service Worker
        const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#3b82f6"/><text x="50" y="55" font-size="50" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">読</text></svg>`;
        const iconBase64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgIcon)));

        const manifest = {
            name: "My読書記録",
            short_name: "読書記録",
            display: "standalone",
            start_url: ".",
            background_color: "#f3f4f6",
            theme_color: "#3b82f6",
            icons: [{ src: iconBase64, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        document.write(`<link rel="manifest" href="${URL.createObjectURL(manifestBlob)}">`);

        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => self.clients.claim());
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
            `;
            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(swBlob));
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans selection:bg-blue-200">

    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold" id="header-title">本棚</h1>
    </header>

    <main class="relative h-full">

        <!-- 1. 本棚ビュー -->
        <div id="view-bookshelf" class="view">
            <div class="flex justify-between items-center p-3 bg-white border-b">
                <span class="text-sm font-bold text-gray-600" id="book-count">全 0 冊</span>
                <button id="btn-toggle-view" class="px-3 py-1 bg-gray-100 border border-gray-300 rounded text-sm font-medium">リスト表示切替</button>
            </div>
            <div id="bookshelf-container" class="scrollable p-4 space-y-4"></div>
        </div>

        <!-- 2. 検索・追加ビュー -->
        <div id="view-add" class="view hide bg-white">
            <div class="p-4 space-y-4 scrollable">
                <button id="btn-start-scan" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold shadow flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                    バーコード（ISBN）をスキャン
                </button>
                <div id="scanner-container" class="w-full hidden bg-black rounded-lg overflow-hidden">
                    <div id="reader" width="100%"></div>
                    <button id="btn-stop-scan" class="w-full bg-red-500 text-white py-2 font-bold">スキャン中止</button>
                </div>
                
                <div class="relative flex items-center pt-2">
                    <div class="flex-grow border-t border-gray-300"></div>
                    <span class="flex-shrink-0 mx-4 text-gray-400 text-sm">またはキーワード検索</span>
                    <div class="flex-grow border-t border-gray-300"></div>
                </div>

                <div class="flex gap-2">
                    <input type="text" id="search-keyword" placeholder="タイトル・著者名・ISBN" class="flex-grow p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="btn-search" class="bg-gray-800 text-white px-4 py-2 rounded-lg font-bold">検索</button>
                </div>
                
                <div id="search-results" class="space-y-3 mt-4 pb-10"></div>
            </div>
        </div>

        <!-- 3. 書籍詳細・編集ビュー -->
        <div id="view-edit" class="view hide bg-gray-50 absolute inset-0 z-20">
            <header class="bg-gray-800 text-white p-4 shadow-md flex justify-between items-center">
                <button id="btn-close-edit" class="text-white px-2">← 戻る</button>
                <h1 class="text-lg font-bold">読書記録</h1>
                <div class="flex gap-2">
                    <button id="btn-delete-book-top" class="text-red-400 font-bold px-2">削除</button>
                    <button id="btn-save-book" class="bg-blue-600 text-white px-3 py-1 rounded font-bold">保存</button>
                </div>
            </header>
            <div class="scrollable p-4 space-y-4">
                <input type="hidden" id="edit-id">
                <input type="hidden" id="edit-isbn">
                
                <div class="bg-white p-4 rounded-lg shadow-sm flex gap-4 items-start">
                    <div class="flex flex-col items-center">
                        <img id="edit-cover-preview" src="" class="w-20 h-28 object-cover rounded border shadow-sm bg-gray-100">
                        <label class="mt-2 text-xs text-blue-600 cursor-pointer border border-blue-600 px-2 py-1 rounded">
                            画像変更
                            <input type="file" id="edit-cover-file" accept="image/*" class="hidden">
                        </label>
                    </div>
                    <div class="flex-grow space-y-2">
                        <div>
                            <label class="text-xs text-gray-500">タイトル</label>
                            <input type="text" id="edit-title" class="w-full border-b p-1 text-base font-bold outline-none">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500">著者名</label>
                            <input type="text" id="edit-author" class="w-full border-b p-1 text-sm outline-none">
                        </div>
                        <div class="flex gap-2">
                            <div class="flex-1">
                                <label class="text-xs text-gray-500">出版社</label>
                                <input type="text" id="edit-publisher" class="w-full border-b p-1 text-xs outline-none">
                            </div>
                            <div class="flex-1">
                                <label class="text-xs text-gray-500">出版日</label>
                                <input type="text" id="edit-publishedDate" class="w-full border-b p-1 text-xs outline-none">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-lg shadow-sm space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">登録日</label>
                        <input type="date" id="edit-registerDate" class="w-full p-2 border rounded bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">所属グループ</label>
                        <select id="edit-groupId" class="w-full p-2 border rounded bg-gray-50"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">読書方法</label>
                        <select id="edit-readMethod" class="w-full p-2 border rounded bg-gray-50">
                            <option value="">未選択</option>
                            <option value="熟読">熟読</option>
                            <option value="斜め読み">斜め読み</option>
                            <option value="途中まで（挫折）">途中まで（挫折）</option>
                            <option value="時間切れ（要再読）">時間切れ（要再読）</option>
                            <option value="参考書読み">参考書読み</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">評価</label>
                        <select id="edit-rating" class="w-full p-2 border rounded bg-gray-50">
                            <option value="0">未評価</option>
                            <option value="5">☆☆☆☆☆ 5</option>
                            <option value="4">☆☆☆☆ 4</option>
                            <option value="3">☆☆☆ 3</option>
                            <option value="2">☆☆ 2</option>
                            <option value="1">☆ 1</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">入手方法</label>
                        <select id="edit-acquisitionSource" class="w-full p-2 border rounded bg-gray-50">
                            <option value="">未選択</option>
                            <option value="電子書籍">電子書籍</option>
                            <option value="購入">購入</option>
                            <option value="図書館">図書館</option>
                            <option value="Audio">Audio</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">感想・メモ</label>
                        <textarea id="edit-review" rows="5" maxlength="1000" class="w-full p-2 border rounded bg-gray-50" placeholder="感想を入力..."></textarea>
                    </div>
                </div>

                <button id="btn-delete-book-bottom" class="w-full py-3 text-red-600 bg-red-50 border border-red-300 rounded-lg font-bold">この本を完全に削除する</button>
            </div>
        </div>

        <!-- 4. グループ管理ビュー -->
        <div id="view-groups" class="view hide bg-white">
            <div class="scrollable p-4 space-y-6">
                <div class="flex gap-2">
                    <input type="text" id="new-group-name" placeholder="新しいグループ名" class="flex-grow p-2 border rounded-lg focus:outline-none">
                    <button id="btn-create-group" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold">作成</button>
                </div>
                <div id="group-list-container" class="space-y-2"></div>
            </div>
        </div>

        <!-- 5. 設定・データ管理ビュー -->
        <div id="view-settings" class="view hide bg-white">
            <div class="scrollable p-6 space-y-8">
                <div>
                    <h2 class="text-lg font-bold border-b pb-2 mb-4">データのバックアップ</h2>
                    <button id="btn-export-csv" class="w-full bg-gray-800 text-white py-3 rounded-lg font-bold shadow">CSVをエクスポート</button>
                </div>
                <div>
                    <h2 class="text-lg font-bold border-b pb-2 mb-4">データの取り込み (ビブリア互換)</h2>
                    <input type="file" id="file-import-csv" accept=".csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
            </div>
        </div>

    </main>

    <!-- ボトムナビゲーション -->
    <nav class="bg-white border-t flex justify-around fixed bottom-0 w-full z-10 pb-safe shadow-inner">
        <button class="nav-btn p-3 flex flex-col items-center text-blue-600" data-target="view-bookshelf">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            <span class="text-xs">本棚</span>
        </button>
        <button class="nav-btn p-3 flex flex-col items-center text-gray-500" data-target="view-add">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <span class="text-xs">追加・検索</span>
        </button>
        <button class="nav-btn p-3 flex flex-col items-center text-gray-500" data-target="view-groups">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            <span class="text-xs">グループ</span>
        </button>
        <button class="nav-btn p-3 flex flex-col items-center text-gray-500" data-target="view-settings">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span class="text-xs">データ</span>
        </button>
    </nav>

    <script>
        const db = new Dexie("BiblioAppDB");
        db.version(1).stores({
            books: 'id, isbn, title, author, groupId, registerDate', 
            groups: 'id, order'
        });

        let currentView = 'view-bookshelf';
        let isGridView = true;
        let html5QrCode = null;

        const noImageSvg = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTQwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjE0MCIgZmlsbD0iI2VlZSIvPjx0ZXh0IHg9IjUwIiB5PSI3MCIgZm9udC1zaXplPSIxMiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iIzk5OSI+Tk8gSU1BR0U8L3RleHQ+PC9zdmc+';

        // 確実な画像表示URLを生成する関数（保存済みの古いデータも救済します）
        function getOptimalCoverUrl(book) {
            if (book.coverUrl) {
                // 古いGoogle BooksのURLがそのまま保存されている場合はプロキシを通す
                if (book.coverUrl.includes('books.google.com') && !book.coverUrl.includes('weserv.nl')) {
                    return `https://images.weserv.nl/?url=${encodeURIComponent(book.coverUrl)}`;
                }
                return book.coverUrl; // openBDなど正常なURL
            }
            if (book.isbn) {
                // coverUrlが空でもISBNがあれば国会図書館(NDL)APIに頼る
                const cleanIsbn = book.isbn.replace(/-/g, '');
                return `https://ndlsearch.ndl.go.jp/thumbnail/${cleanIsbn}.jpg`;
            }
            return noImageSvg;
        }

        // ナビゲーション
        const navBtns = document.querySelectorAll('.nav-btn');
        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const target = btn.dataset.target;
                navBtns.forEach(b => { b.classList.remove('text-blue-600'); b.classList.add('text-gray-500'); });
                btn.classList.remove('text-gray-500'); btn.classList.add('text-blue-600');

                document.querySelectorAll('.view').forEach(v => v.classList.add('hide'));
                document.getElementById(target).classList.remove('hide');
                
                const titles = { 'view-bookshelf': '本棚', 'view-add': '本の登録・検索', 'view-groups': 'グループ管理', 'view-settings': 'データ管理' };
                document.getElementById('header-title').innerText = titles[target];

                if(target === 'view-bookshelf') renderBookshelf();
                if(target === 'view-groups') renderGroupsManage();
            });
        });

        // 本棚
        document.getElementById('btn-toggle-view').addEventListener('click', () => {
            isGridView = !isGridView;
            renderBookshelf();
        });

        async function renderBookshelf() {
            const container = document.getElementById('bookshelf-container');
            container.innerHTML = '';
            const books = await db.books.toArray();
            const groups = await db.groups.orderBy('order').toArray();
            
            document.getElementById('book-count').innerText = `全 ${books.length} 冊`;

            const groupedBooks = { '未分類': [] };
            groups.forEach(g => groupedBooks[g.id] = { name: g.name, books: [] });
            books.forEach(b => {
                if (b.groupId && groupedBooks[b.groupId]) groupedBooks[b.groupId].books.push(b);
                else groupedBooks['未分類'].push(b);
            });

            for (const [key, group] of Object.entries(groupedBooks)) {
                const isUncat = key === '未分類';
                const bookList = isUncat ? group : group.books;
                const groupName = isUncat ? '未分類' : group.name;

                if (bookList.length === 0 && isUncat) continue;

                const groupEl = document.createElement('div');
                groupEl.className = 'mb-6';
                const headerEl = document.createElement('h2');
                headerEl.className = 'text-base font-bold border-b-2 border-blue-300 mb-3 pb-1 text-gray-700 flex justify-between';
                headerEl.innerHTML = `<span>${groupName}</span> <span class="text-sm font-normal text-gray-500">${bookList.length}冊</span>`;
                groupEl.appendChild(headerEl);

                const listEl = document.createElement('div');
                listEl.className = isGridView ? 'grid grid-cols-3 gap-3' : 'space-y-2';
                bookList.sort((a, b) => (a.orderInGroup || 0) - (b.orderInGroup || 0));

                bookList.forEach(book => {
                    const item = document.createElement('div');
                    const coverImg = getOptimalCoverUrl(book); // ★改善した表示ロジックを使用

                    if (isGridView) {
                        item.className = 'flex flex-col items-center cursor-pointer relative';
                        item.innerHTML = `
                            <img src="${coverImg}" class="w-full h-36 object-cover rounded shadow border bg-gray-200" loading="lazy" onerror="this.src='${noImageSvg}'">
                            <span class="text-xs text-center line-clamp-2 w-full mt-1">${book.title}</span>
                        `;
                        item.addEventListener('click', () => openEditBook(book));
                    } else {
                        item.className = 'flex items-center p-2 bg-white rounded shadow-sm border justify-between';
                        item.innerHTML = `
                            <div class="flex items-center gap-3 min-w-0 flex-grow cursor-pointer book-info-click">
                                <img src="${coverImg}" class="w-10 h-14 object-cover border rounded flex-shrink-0 bg-gray-200" onerror="this.src='${noImageSvg}'">
                                <div class="min-w-0">
                                    <p class="text-sm font-bold truncate">${book.title}</p>
                                    <p class="text-xs text-gray-500 truncate">${book.author}</p>
                                    <span class="text-xs text-blue-500">${book.registerDate || ''}</span>
                                </div>
                            </div>
                            <button class="text-red-500 text-xs px-2 py-1 border border-red-200 rounded ml-2 flex-shrink-0 btn-quick-del">削除</button>
                        `;
                        item.querySelector('.book-info-click').addEventListener('click', () => openEditBook(book));
                        item.querySelector('.btn-quick-del').addEventListener('click', async (e) => {
                            e.stopPropagation();
                            if(confirm(`「${book.title}」を削除しますか？`)) {
                                await db.books.delete(book.id);
                                renderBookshelf();
                            }
                        });
                    }
                    listEl.appendChild(item);
                });
                
                if(bookList.length > 0) { groupEl.appendChild(listEl); container.appendChild(groupEl); }
            }
        }

        // スキャン & 検索
        document.getElementById('btn-start-scan').addEventListener('click', () => {
            document.getElementById('scanner-container').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    const cleanIsbn = decodedText.replace(/-/g, '');
                    if(cleanIsbn.startsWith('978') || cleanIsbn.startsWith('979')) {
                        stopScanner(); searchBookByISBN(cleanIsbn);
                    }
                }, () => {}
            ).catch(err => {
                alert("カメラの起動に失敗しました。");
                document.getElementById('scanner-container').classList.add('hidden');
            });
        });

        document.getElementById('btn-stop-scan').addEventListener('click', stopScanner);
        function stopScanner() {
            if(html5QrCode) html5QrCode.stop().then(() => { document.getElementById('scanner-container').classList.add('hidden'); }).catch(e=>e);
        }

        document.getElementById('btn-search').addEventListener('click', () => {
            const kw = document.getElementById('search-keyword').value.trim();
            if(!kw) return;
            const clean = kw.replace(/-/g, '');
            if(clean.match(/^97[89]\d{10}$/)) searchBookByISBN(clean);
            else searchBookByKeyword(kw);
        });

        // 検索ロジック (オープンURL優先 + プロキシ)
        async function searchBookByISBN(isbn) {
            document.getElementById('search-results').innerHTML = '<p class="text-center text-gray-500">検索中...</p>';
            let bookData = null;

            // 1. openBD (とても安定した画像URLを返す)
            try {
                const res = await fetch(`https://api.openbd.jp/v1/get?isbn=${isbn}`);
                const data = await res.json();
                if (data && data[0] && data[0].summary) {
                    const s = data[0].summary;
                    bookData = {
                        isbn: isbn, title: s.title || '', author: s.author || '',
                        publisher: s.publisher || '', publishedDate: s.pubdate || '',
                        coverUrl: s.cover || `https://ndlsearch.ndl.go.jp/thumbnail/${isbn}.jpg` // 空ならNDLをセット
                    };
                }
            } catch(e) {}

            // 2. Google Books (openBDで見つからない場合。画像はプロキシを通す)
            if (!bookData) {
                try {
                    const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
                    const data = await res.json();
                    if (data.items && data.items.length > 0) {
                        const info = data.items[0].volumeInfo;
                        let gCover = `https://ndlsearch.ndl.go.jp/thumbnail/${isbn}.jpg`; // ベースはNDL
                        if (info.imageLinks && info.imageLinks.thumbnail) {
                            const rawUrl = info.imageLinks.thumbnail.replace('http:', 'https:').replace(/&edge=curl/g, '');
                            gCover = `https://images.weserv.nl/?url=${encodeURIComponent(rawUrl)}`; // プロキシ経由
                        }
                        bookData = {
                            isbn: isbn, title: info.title || 'タイトル不明', author: info.authors ? info.authors.join(', ') : '',
                            publisher: info.publisher || '', publishedDate: info.publishedDate || '', coverUrl: gCover
                        };
                    }
                } catch(e) {}
            }

            if (bookData) showSearchResults([bookData]);
            else document.getElementById('search-results').innerHTML = '<p class="text-center text-red-500">見つかりませんでした。</p>';
        }

        async function searchBookByKeyword(keyword) {
            document.getElementById('search-results').innerHTML = '<p class="text-center text-gray-500">検索中...</p>';
            try {
                const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(keyword)}&maxResults=10`);
                const data = await res.json();
                if (data.items && data.items.length > 0) {
                    const results = data.items.map(item => {
                        const info = item.volumeInfo;
                        let isbn = '';
                        if(info.industryIdentifiers) {
                            const i13 = info.industryIdentifiers.find(i => i.type === 'ISBN_13');
                            if(i13) isbn = i13.identifier;
                        }
                        let gCover = '';
                        if (info.imageLinks && info.imageLinks.thumbnail) {
                            const rawUrl = info.imageLinks.thumbnail.replace('http:', 'https:').replace(/&edge=curl/g, '');
                            gCover = `https://images.weserv.nl/?url=${encodeURIComponent(rawUrl)}`;
                        } else if (isbn) {
                            gCover = `https://ndlsearch.ndl.go.jp/thumbnail/${isbn}.jpg`;
                        }
                        return {
                            isbn: isbn, title: info.title || 'タイトル不明', author: info.authors ? info.authors.join(', ') : '',
                            publisher: info.publisher || '', publishedDate: info.publishedDate || '', coverUrl: gCover
                        };
                    });
                    showSearchResults(results);
                } else { document.getElementById('search-results').innerHTML = '<p class="text-center text-red-500">見つかりませんでした。</p>'; }
            } catch (e) { document.getElementById('search-results').innerHTML = '<p class="text-center text-red-500">エラーが発生しました。</p>'; }
        }

        function showSearchResults(books) {
            const container = document.getElementById('search-results');
            container.innerHTML = '';
            books.forEach(b => {
                const el = document.createElement('div');
                el.className = 'flex gap-3 p-3 border rounded-lg bg-gray-50 shadow-sm items-center';
                const cover = b.coverUrl ? b.coverUrl : noImageSvg;
                el.innerHTML = `
                    <img src="${cover}" class="w-12 h-16 object-cover border bg-gray-200" onerror="this.src='${noImageSvg}'">
                    <div class="flex-grow min-w-0">
                        <p class="text-sm font-bold truncate">${b.title}</p>
                        <p class="text-xs text-gray-500 truncate">${b.author}</p>
                        <p class="text-xs text-gray-400">${b.publisher}</p>
                    </div>
                    <button class="bg-blue-600 text-white px-3 py-1 rounded text-sm font-bold whitespace-nowrap btn-register">登録</button>
                `;
                el.querySelector('.btn-register').addEventListener('click', async () => {
                    const today = new Date().toISOString().split('T')[0];
                    const newBook = {
                        id: crypto.randomUUID(), isbn: b.isbn, title: b.title, author: b.author,
                        publisher: b.publisher, publishedDate: b.publishedDate, coverUrl: b.coverUrl,
                        registerDate: today, readMethod: '', rating: 0, review: '', acquisitionSource: '',
                        groupId: null, orderInGroup: 0
                    };
                    await db.books.put(newBook);
                    openEditBook(newBook);
                    document.getElementById('search-keyword').value = '';
                    container.innerHTML = '';
                });
                container.appendChild(el);
            });
        }

        // 編集
        let currentCoverBase64 = '';
        async function openEditBook(book) {
            const groups = await db.groups.orderBy('order').toArray();
            const groupSelect = document.getElementById('edit-groupId');
            groupSelect.innerHTML = '<option value="">未分類</option>';
            groups.forEach(g => {
                const opt = document.createElement('option'); opt.value = g.id; opt.innerText = g.name; groupSelect.appendChild(opt);
            });

            document.getElementById('edit-id').value = book.id; document.getElementById('edit-isbn').value = book.isbn || '';
            document.getElementById('edit-title').value = book.title || ''; document.getElementById('edit-author').value = book.author || '';
            document.getElementById('edit-publisher').value = book.publisher || ''; document.getElementById('edit-publishedDate').value = book.publishedDate || '';
            document.getElementById('edit-registerDate').value = book.registerDate || ''; document.getElementById('edit-groupId').value = book.groupId || '';
            document.getElementById('edit-readMethod').value = book.readMethod || ''; document.getElementById('edit-rating').value = book.rating || 0;
            document.getElementById('edit-acquisitionSource').value = book.acquisitionSource || ''; document.getElementById('edit-review').value = book.review || '';

            currentCoverBase64 = book.coverUrl || '';
            const preview = document.getElementById('edit-cover-preview');
            preview.src = getOptimalCoverUrl(book); // ここも安全な表示用関数を通す
            preview.onerror = () => { preview.src = noImageSvg; };

            document.getElementById('view-edit').classList.remove('hide');
        }

        document.getElementById('edit-cover-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                currentCoverBase64 = event.target.result; // 手動の時はBase64をセット
                document.getElementById('edit-cover-preview').src = currentCoverBase64;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('btn-close-edit').addEventListener('click', () => { document.getElementById('view-edit').classList.add('hide'); renderBookshelf(); });

        document.getElementById('btn-save-book').addEventListener('click', async () => {
            const updatedBook = {
                id: document.getElementById('edit-id').value, isbn: document.getElementById('edit-isbn').value,
                coverUrl: currentCoverBase64, title: document.getElementById('edit-title').value,
                author: document.getElementById('edit-author').value, publisher: document.getElementById('edit-publisher').value,
                publishedDate: document.getElementById('edit-publishedDate').value, registerDate: document.getElementById('edit-registerDate').value,
                groupId: document.getElementById('edit-groupId').value || null, readMethod: document.getElementById('edit-readMethod').value,
                rating: Number(document.getElementById('edit-rating').value), acquisitionSource: document.getElementById('edit-acquisitionSource').value,
                review: document.getElementById('edit-review').value, orderInGroup: 0
            };
            await db.books.put(updatedBook);
            document.getElementById('view-edit').classList.add('hide'); renderBookshelf();
        });

        async function executeDelete() {
            if(confirm(`この本を削除してもよろしいですか？`)) {
                await db.books.delete(document.getElementById('edit-id').value);
                document.getElementById('view-edit').classList.add('hide'); renderBookshelf();
            }
        }
        document.getElementById('btn-delete-book-top').addEventListener('click', executeDelete);
        document.getElementById('btn-delete-book-bottom').addEventListener('click', executeDelete);

        // グループ
        async function renderGroupsManage() {
            const container = document.getElementById('group-list-container'); container.innerHTML = '';
            const groups = await db.groups.orderBy('order').toArray();
            groups.forEach(g => {
                const el = document.createElement('div'); el.className = 'flex justify-between items-center p-3 bg-gray-50 border rounded';
                el.innerHTML = `<span class="font-bold">${g.name}</span><button class="text-red-500 text-sm px-2 py-1 btn-del-group">削除</button>`;
                el.querySelector('.btn-del-group').addEventListener('click', async () => {
                    if(confirm(`グループ「${g.name}」を削除しますか？`)) {
                        await db.books.where('groupId').equals(g.id).modify({groupId: null});
                        await db.groups.delete(g.id); renderGroupsManage();
                    }
                });
                container.appendChild(el);
            });
        }
        document.getElementById('btn-create-group').addEventListener('click', async () => {
            const nameInput = document.getElementById('new-group-name'); const name = nameInput.value.trim(); if(!name) return;
            await db.groups.put({ id: crypto.randomUUID(), name: name, order: await db.groups.count() });
            nameInput.value = ''; renderGroupsManage();
        });

        // CSV
        document.getElementById('btn-export-csv').addEventListener('click', async () => {
            const books = await db.books.toArray();
            if(books.length === 0) return alert('出力データがありません。');
            const headers = ['id', 'isbn', 'title', 'author', 'publisher', 'publishedDate', 'registerDate', 'readMethod', 'rating', 'acquisitionSource', 'review', 'groupId', 'coverUrl'];
            let csvContent = '\uFEFF' + headers.join(',') + '\n';
            books.forEach(b => {
                csvContent += headers.map(h => {
                    let val = b[h] == null ? '' : String(b[h]);
                    return (val.includes(',') || val.includes('\n') || val.includes('"')) ? '"' + val.replace(/"/g, '""') + '"' : val;
                }).join(',') + '\n';
            });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }));
            a.download = `my_books_backup_${new Date().toISOString().split('T')[0]}.csv`; a.click();
        });

        document.getElementById('file-import-csv').addEventListener('change', (e) => {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
                const lines = event.target.result.split(/\r?\n/).filter(l => l.trim() !== '');
                if(lines.length < 2) return alert('CSVが見つかりません。');
                const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim());
                let importCount = 0;
                for(let i = 1; i < lines.length; i++) {
                    let inQuotes = false, currentVal = ''; const row = [];
                    for(let char of lines[i]) {
                        if(char === '"') inQuotes = !inQuotes;
                        else if(char === ',' && !inQuotes) { row.push(currentVal); currentVal = ''; }
                        else { currentVal += char; }
                    }
                    row.push(currentVal);
                    const book = { id: crypto.randomUUID(), groupId: null, orderInGroup: 0 };
                    headers.forEach((h, index) => {
                        let val = (row[index] || '').replace(/^"|"$/g, '').replace(/""/g, '"');
                        if(h.includes('タイトル') || h === 'title') book.title = val;
                        else if(h.includes('著者') || h === 'author') book.author = val;
                        else if(h.includes('ISBN') || h.toLowerCase() === 'isbn') book.isbn = val.replace(/-/g, '');
                        else if(h.includes('出版社') || h === 'publisher') book.publisher = val;
                        else if(h.includes('発行日') || h === 'publishedDate') book.publishedDate = val;
                        else if(h.includes('登録日') || h.includes('読了日') || h === 'registerDate') book.registerDate = val.replace(/\//g, '-').substring(0,10);
                        else if(h.includes('感想') || h === 'review') book.review = val;
                        else if(h.includes('評価') || h === 'rating') book.rating = Number(val.replace(/[^0-9]/g, '')) || 0;
                        else if(h === 'readMethod') book.readMethod = val;
                        else if(h === 'acquisitionSource') book.acquisitionSource = val;
                        else if(h === 'coverUrl') book.coverUrl = val;
                    });
                    if(book.title) {
                        if(!book.registerDate) book.registerDate = new Date().toISOString().split('T')[0];
                        await db.books.put(book); importCount++;
                    }
                }
                alert(`${importCount} 冊取り込みました。`); e.target.value = ''; renderBookshelf();
            };
            reader.readAsText(file);
        });

        window.addEventListener('DOMContentLoaded', () => { renderBookshelf(); });
    </script>
</body>
</html>
